<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratih Salsabila | Portfolio</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- REACT -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- TAILWIND -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  --primary: #0A0A1A;
  --secondary: #1A143A;
  --accent: #A78BFA;
  --accent-dark: #8B5CF6;
  --gold: #F4C430;
  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, #2A1F5A 100%);
  background-attachment: fixed;
  color: #E2E8F0;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 80%, rgba(167,139,250,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(244,196,48,0.12) 0%, transparent 50%);
  z-index: -1;
}

h1,h2,h3 { font-family: 'Playfair Display', serif; font-weight: 700; }

.glass {
  background: var(--glass);
  backdrop-filter: blur(25px);
  border: 1px solid var(--glass-border);
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}

.neon-glow {
  box-shadow: 0 0 30px rgba(167,139,250,0.5), 0 0 60px rgba(167,139,250,0.2);
}

.neon-text {
  background: linear-gradient(135deg, #A78BFA, #F4C430, #8B5CF6);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 3s ease infinite;
}
@keyframes gradientShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.reveal {
  opacity: 0;
  transform: translateY(60px);
  transition: all 1.2s cubic-bezier(0.25,0.46,0.45,0.94);
}
.reveal.active { opacity: 1; transform: translateY(0); }

.modern-card {
  transition: all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid transparent;
}
.modern-card:hover {
  transform: translateY(-20px) scale(1.03);
  border-color: rgba(167,139,250,0.4);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 40px rgba(167,139,250,0.4);
}

.skill-bar {
  background: rgba(255,255,255,0.12);
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
}
.skill-progress {
  height: 100%;
  background: linear-gradient(90deg, #A78BFA, #F4C430);
  border-radius: 4px;
  transition: width 2.5s ease;
  position: relative;
}
.skill-progress::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
}
@keyframes particleFloat {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

.mobile-menu {
  transform: translateX(100%);
  transition: transform 0.4s ease;
}
.mobile-menu.open { transform: translateX(0); }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
function App() {
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [text, setText] = React.useState("");
  const [charIndex, setCharIndex] = React.useState(0);
  const [roleIndex, setRoleIndex] = React.useState(0);
  const roles = ["Web Developer", "Java Programmer", "UI/UX Designer"];

  // Typing Effect
  React.useEffect(() => {
    const timeout = setTimeout(() => {
      if (charIndex < roles[roleIndex].length) {
        setText(prev => prev + roles[roleIndex][charIndex]);
        setCharIndex(prev => prev + 1);
      } else {
        setTimeout(() => {
          setText(""); setCharIndex(0);
          setRoleIndex((roleIndex + 1) % roles.length);
        }, 2000);
      }
    }, charIndex === 0 ? 300 : 80);
    return () => clearTimeout(timeout);
  }, [charIndex, roleIndex]);

  // Scroll Reveal
  React.useEffect(() => {
  const reveals = document.querySelectorAll(".reveal");

  const revealOnScroll = () => {
    reveals.forEach(el => {
      const windowHeight = window.innerHeight;
      const elementTop = el.getBoundingClientRect().top;

      if (elementTop < windowHeight - 100) {
        el.classList.add("active");
      }
    });
  };

  window.addEventListener("scroll", revealOnScroll);
  revealOnScroll(); // langsung jalan saat load

  return () => window.removeEventListener("scroll", revealOnScroll);
}, []);

  const skills = [
    { name: "JavaScript", progress: 76 },
    { name: "Java OOP", progress: 80 },
    { name: "HTML", progress: 84 },
    { name: "UI/UX Design", progress: 78 },
    { name: "Mobile Development", progress: 70 }
  ];

  const projects = [
    {
      title: "Object-Oriented Programming",
      desc: "Modern Java library app with authentication & analytics",
      tech: ["Java", "Swing", "MySQL"],
      link: "https://github.com/ratihsal/Bukuin.git"
    },
    {
      title: "Visual Programming", 
      desc: "Real-time quiz app with gamification features",
      tech: ["C#", "WinForms", "SQL"],
      link: "https://github.com/ratihsal/project-quiz.git"
    },
    {
      title: "Mobile Development",
      desc: "Laundry management app",
      tech: ["Java", "Desktop", "Database"],
      link: "https://github.com/ratihsal/Laundry_Apps.git"
    }
  ];

  return (
    <div>
      {/* Particles */}
      {Array.from({length: 25}).map((_, i) => (
        <div key={i} className="particle" style={{
          left: `${Math.random()*100}%`,
          width: `${2+Math.random()*4}px`,
          height: `${2+Math.random()*4}px`,
          animationDelay: `${Math.random()*15}s`,
          animation: `particleFloat ${20+Math.random()*10}s infinite linear`
        }} />
      ))}

      {/* NAVBAR */}
      <nav className="fixed top-0 w-full glass z-50 px-6 py-5">
        <div className="max-w-7xl mx-auto flex justify-between items-center">
          <div className="text-3xl font-bold neon-text flex items-center gap-3">
            <i className="fas fa-crown text-yellow-400 text-xl"></i>
            <span>Ratih</span>
          </div>
          
          <div className="hidden lg:flex items-center gap-10">
            {['Home','About','Skills','Projects','Contact'].map(item => (
              <a key={item} href={`#${item.toLowerCase()}`} 
                 className="relative group text-gray-300 hover:text-white transition-all">
                {item}
                <span className="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-[#A78BFA] to-[#F4C430] group-hover:w-full transition-all"></span>
              </a>
            ))}
          </div>

          <button className="lg:hidden p-3 glass rounded-2xl" onClick={() => setMenuOpen(!menuOpen)}>
            <i className={`fas text-xl ${menuOpen ? 'fa-times text-red-400' : 'fa-bars text-[#A78BFA]'}`}></i>
          </button>
        </div>

        <div className={`lg:hidden mt-4 glass rounded-3xl overflow-hidden ${menuOpen ? 'mobile-menu open' : 'mobile-menu'}`}>
          {['Home','About','Skills','Projects','Contact'].map(item => (
            <a key={item} href={`#${item.toLowerCase()}`} className="block px-8 py-5 text-gray-300 hover:text-white hover:bg-white/10 border-b border-white/5 last:border-b-0 transition-all" onClick={() => setMenuOpen(false)}>
              {item}
            </a>
          ))}
        </div>
      </nav>

      {/* HERO */}
      <section id="home" className="min-h-screen flex flex-col justify-center items-center text-center px-6 pt-28">
  
  <div className="relative mb-16 group flex items-center justify-center">

    {/* BLUR GLOW (FIXED) */}
    <div className="absolute inset-0 scale-90 bg-gradient-to-r from-[#A78BFA] to-[#F4C430] rounded-3xl blur-lg md:blur-xl opacity-20 md:opacity-30 group-hover:opacity-50 transition-all duration-500 -z-10"></div>

    {/* IMAGE */}
    <div className="w-60 h-60 glass rounded-3xl p-3 bg-gradient-to-br from-[#A78BFA]/20 to-[#F4C430]/20">
      <img 
        src="Ratih.jpeg" 
        alt="Ratih"
        className="w-full h-full rounded-2xl object-cover border-4 border-white/30 transition-transform duration-700 group-hover:scale-110"
      />
    </div>
    </div>

        <h1 className="text-6xl md:text-8xl font-bold mb-8 leading-tight">
          Hi, I'm <span className="block neon-text">Ratih Salsabila</span>
        </h1>

        <div className="glass px-12 py-6 rounded-3xl mb-12 w-fit mx-auto">
          <div className="text-2xl font-semibold text-[#A78BFA] h-12 flex items-center justify-center">
            {text || <i className="fas fa-circle-notch animate-spin"></i>} |
          </div>
        </div>

        <p className="text-xl md:text-2xl text-gray-300 max-w-3xl mx-auto mb-16 leading-relaxed">
          Passionate developer creating <span className="neon-text">beautiful</span> and <span className="neon-text">functional</span> digital experiences
        </p>

        <div className="flex flex-col sm:flex-row gap-6">
          <a href="#projects" className="glass px-12 py-6 rounded-3xl font-semibold text-xl hover:neon-glow transition-all flex items-center justify-center gap-3">
            <i className="fas fa-rocket"></i> Explore Projects
          </a>
          <a href="#contact" className="glass px-12 py-6 rounded-3xl font-semibold text-xl border border-white/20 hover:bg-white/10 transition-all flex items-center justify-center gap-3">
            <i className="fas fa-envelope"></i> Say Hello
          </a>
        </div>
      </section>

      {/* ABOUT */}
      <section id="about" className="py-40 px-6 reveal">
        <div className="max-w-4xl mx-auto text-center">
          <h2 className="text-6xl font-bold mb-16 neon-text">About Me</h2>
          <div className="glass p-16 rounded-3xl modern-card max-w-3xl mx-auto">
           <p className="text-xl md:text-2xl text-gray-300 leading-relaxed">
                My name is <span className="text-[#A78BFA] font-semibold">Ratih Salsabila</span>, born in Sidoarjo on March 28, 2006. I am currently a student of S1 Education in Information Technology at the Faculty of Engineering, Universitas Surabaya. I live in Babatan Jati, Jati, Sidoarjo Regency, East Java, Indonesia, Surabaya. I enjoy transforming complex problems into simple and elegant solutions through coding and design, and I am passionate about keeping up with technology and digital media trends.
          </p>
          </div>
        </div>
      </section>

      {/* SKILLS */}
      <section id="skills" className="py-40 px-6 reveal">
        <div className="max-w-6xl mx-auto">
          <h2 className="text-6xl font-bold text-center mb-24 neon-text">Skills Mastery</h2>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
            {skills.map((skill, i) => (
              <div key={i} className="glass p-10 rounded-3xl modern-card">
                <div className="flex justify-between items-start mb-6">
                  <h3 className="text-2xl font-semibold">{skill.name}</h3>
                  <span className="text-3xl font-bold text-[#A78BFA]">{skill.progress}%</span>
                </div>
                <div className="skill-bar mb-4">
                  <div className="skill-progress" style={{width: `${skill.progress}%`}} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PROJECTS */}
      <section id="projects" className="py-40 px-6 reveal">
        <div className="max-w-6xl mx-auto">
          <h2 className="text-6xl font-bold text-center mb-24 neon-text">Featured Projects</h2>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
            {projects.map((p, i) => (
              <a key={i} href={p.link} target="_blank" className="modern-card group p-10 rounded-3xl h-80 flex flex-col hover:neon-glow">
                <div className="mb-6">
                  <h3 className="text-2xl font-bold mb-3 group-hover:text-[#A78BFA] transition-colors">{p.title}</h3>
                  <p className="text-gray-400 mb-6">{p.desc}</p>
                  <div className="flex flex-wrap gap-2">
                    {p.tech.map(t => (
                      <span key={t} className="px-3 py-1 bg-white/5 rounded-full text-sm">{t}</span>
                    ))}
                  </div>
                </div>
                <div className="text-[#A78BFA] font-semibold flex items-center gap-2 group-hover:gap-4 transition-all">
                  View on GitHub <i className="fas fa-arrow-right"></i>
                </div>
              </a>
            ))}
          </div>
        </div>
      </section>

      {/* CONTACT */}
      <section id="contact" className="py-40 px-6 reveal">
        <div className="max-w-2xl mx-auto text-center">
          <h2 className="text-6xl font-bold mb-12 neon-text">Let's Connect</h2>
          <div className="space-y-6">
            <a href="mailto:24050974001@mhs.unesa.ac.id" className="glass p-8 rounded-3xl modern-card block text-2xl font-semibold hover:neon-glow transition-all">
              <i className="fas fa-envelope mr-4"></i> 24050974001@mhs.unesa.ac.id
            </a>
            <a href="https://github.com/ratihsal" target="_blank" className="glass p-8 rounded-3xl modern-card block text-2xl font-semibold hover:neon-glow transition-all">
              <i className="fab fa-github mr-4"></i> github.com/ratihsal
            </a>
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
